<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/shared/vendor/gsap/gsap.min.js"></script>
    <script src="assets/data/n2.js"></script>
    <script src="assets/text/zh-CN.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/shared/vendor/three/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/shared/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #bfe3f5; }
      #root { width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; color: #3a3330; }
      #stage { position: absolute; inset: 0; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
      svg.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #title { position: absolute; left: 0; width: 1920px; top: 380px; text-align: center; font-size: 150px; font-weight: 300; letter-spacing: 40px; color: #34404e; opacity: 0; text-shadow: 0 0 24px rgba(255, 255, 255, 0.95), 0 0 60px rgba(255, 255, 255, 0.8); }
      .say { position: absolute; left: 0; top: 0; }
      .bub { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; padding: 14px 30px; border-radius: 40px; background: #fffaf2; font-size: 44px; font-weight: 500; opacity: 0; box-shadow: 0 6px 20px rgba(40, 50, 70, 0.18); }
      .bub::after { content: ""; position: absolute; left: 50%; bottom: -16px; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid #fffaf2; border-bottom: 0; }
      .envText { font-size: 64px; font-weight: 500; fill: #4a3a30; }
      .letter { position: absolute; left: 640px; width: 640px; font-size: 52px; font-weight: 400; line-height: 1.4; color: #4a3a30; opacity: 0; }
      #endText { position: absolute; left: 0; width: 1920px; top: 470px; text-align: center; font-size: 60px; font-weight: 300; letter-spacing: 6px; color: #34404e; opacity: 0; text-shadow: 0 0 20px rgba(255, 255, 255, 0.95), 0 0 50px rgba(255, 255, 255, 0.85); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="96" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="96" data-track-index="0" data-layout-allow-overlap>
        <canvas id="gl" width="1920" height="1080"></canvas>
        <div id="title"></div>
        <div id="askPos" class="say"><div id="ask" class="bub"></div></div>
        <div id="replyPos" class="say"><div id="reply" class="bub"></div></div>

        <!-- 春·室内：窗台的猫、伏案写信的女孩 -->
        <div id="roomA" class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <rect width="1920" height="1080" fill="#f6e7cf" />
            <rect y="760" width="1920" height="320" fill="#d9b98c" />
            <rect id="winA" x="1060" y="150" width="620" height="460" rx="8" fill="#bfe3f5" />
            <circle cx="1500" cy="300" r="60" fill="#fff4c8" />
            <path d="M1060,520 q160,-80 320,-20 t300,-30 v140 h-620z" fill="#9fd68a" />
            <g fill="#f6b8cc"><circle cx="1180" cy="430" r="44" /><circle cx="1230" cy="400" r="36" /><circle cx="1140" cy="395" r="30" /></g>
            <rect x="1196" y="440" width="12" height="80" fill="#8a5a3a" />
            <rect x="1060" y="150" width="620" height="460" rx="8" fill="none" stroke="#a87a52" stroke-width="22" />
            <line x1="1370" y1="150" x2="1370" y2="610" stroke="#a87a52" stroke-width="14" />
            <rect x="1030" y="606" width="680" height="28" rx="6" fill="#a87a52" />
            <g id="catA" transform="translate(1520,606)">
              <ellipse cx="0" cy="-34" rx="58" ry="36" fill="#4a4a52" />
              <circle cx="46" cy="-64" r="28" fill="#4a4a52" />
              <polygon points="30,-86 38,-108 50,-88" fill="#4a4a52" /><polygon points="52,-88 64,-106 68,-82" fill="#4a4a52" />
              <g transform="translate(-50,-30)"><path id="catTail" d="M0,0 q-50,-10 -40,-70" fill="none" stroke="#4a4a52" stroke-width="14" stroke-linecap="round" /></g>
            </g>
            <rect x="260" y="560" width="900" height="34" rx="8" fill="#b4825a" />
            <rect x="300" y="594" width="30" height="300" fill="#8a5a3a" /><rect x="1090" y="594" width="30" height="300" fill="#8a5a3a" />
            <rect x="420" y="520" width="380" height="44" rx="4" fill="#fffaf0" transform="rotate(-4 610 540)" />
            <g id="girlA" transform="translate(-330,0)">
              <path d="M520,890 q-10,-200 60,-290 q60,-40 120,0 q70,90 60,290z" fill="#f2a65a" />
              <circle cx="640" cy="470" r="80" fill="#f2d2b6" />
              <path d="M556,470 q0,-110 84,-110 q90,0 86,110 q-20,-60 -86,-70 q-60,10 -84,70z" fill="#4a2f22" />
              <path d="M720,470 q40,40 20,120" fill="none" stroke="#4a2f22" stroke-width="26" stroke-linecap="round" />
              <g id="armA"><path d="M690,640 q60,-60 110,-90" fill="none" stroke="#f2a65a" stroke-width="40" stroke-linecap="round" /><circle cx="806" cy="546" r="20" fill="#f2d2b6" /><line x1="800" y1="550" x2="830" y2="500" stroke="#3a6fb0" stroke-width="8" stroke-linecap="round" /></g>
            </g>
            <path id="inkLine" d="M470,535 q40,-14 80,-6 t80,-8 t80,-6 t70,-4" fill="none" stroke="#5f86b8" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>

        <!-- 特写：信封与邮戳（春写下、冬拆开共用） -->
        <div id="envLayer" class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <rect width="1920" height="1080" fill="#e9d6b8" />
            <g id="envelope">
              <rect x="460" y="250" width="1000" height="580" rx="14" fill="#fbf3e2" />
              <path id="flap" d="M460,264 L960,600 L1460,264" fill="#f1e2c6" stroke="#e0cba8" stroke-width="4" />
              <text id="envTo" class="envText" x="560" y="700"></text>
              <text id="envFrom" class="envText" x="560" y="780" style="font-size: 40px; font-weight: 400; fill: #8a7a6a"></text>
              <g id="stampG" transform="translate(1260,400)">
                <rect x="-90" y="-110" width="180" height="220" fill="#f4b6c8" stroke="#fff" stroke-width="10" stroke-dasharray="14 8" />
                <circle cx="0" cy="-10" r="44" fill="#fff4c8" /><path d="M-70,60 q40,-40 70,-10 t70,-20 v40 h-140z" fill="#9fd68a" />
              </g>
              <g id="markG" opacity="0" transform="translate(1180,470) rotate(-14)">
                <circle r="110" fill="none" stroke="#c8564a" stroke-width="8" />
                <circle r="84" fill="none" stroke="#c8564a" stroke-width="4" />
                <text id="markText" x="0" y="20" text-anchor="middle" style="font-size: 56px; font-weight: 600; fill: #c8564a"></text>
              </g>
            </g>
          </svg>
        </div>

        <!-- 秋：一片枫叶飘落、盖满画面，转入冬 -->
        <div id="leafLayer" class="layer" style="opacity: 1">
          <svg class="full" viewBox="0 0 1920 1080">
            <g id="leaf" opacity="0"><g id="leafShape">
              <path d="M0,-120 L28,-60 L80,-82 L62,-28 L118,-20 L70,18 L92,64 L30,48 L10,110 L0,60 L-10,110 L-30,48 L-92,64 L-70,18 L-118,-20 L-62,-28 L-80,-82 L-28,-60 Z" fill="#e8833a" />
              <path d="M0,-100 V130 M0,0 L60,-50 M0,0 L-60,-50 M0,30 L50,40 M0,30 L-50,40" stroke="#c4602a" stroke-width="4" fill="none" />
            </g></g>
          </svg>
        </div>

        <!-- 冬·室内：壁炉、睡猫、读信 -->
        <div id="roomB" class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <rect width="1920" height="1080" fill="#7a6068" />
            <rect y="800" width="1920" height="280" fill="#a07a5e" />
            <rect x="120" y="180" width="460" height="400" rx="8" fill="#1d2840" />
            <g fill="#fff"><circle cx="200" cy="260" r="4" /><circle cx="330" cy="330" r="3" /><circle cx="460" cy="240" r="4" /><circle cx="520" cy="420" r="3" /><circle cx="260" cy="460" r="3" /></g>
            <path d="M120,520 q120,-40 230,-10 t230,-20 v90 h-460z" fill="#e8eef4" />
            <rect x="120" y="180" width="460" height="400" rx="8" fill="none" stroke="#7a5a42" stroke-width="20" />
            <rect x="1340" y="430" width="440" height="380" fill="#8a6a5a" />
            <rect x="1400" y="560" width="320" height="250" rx="140" fill="#2a2228" />
            <g id="fire"><path id="flame1" d="M1500,810 q-30,-90 20,-150 q10,60 40,70 q20,-60 10,-110 q70,70 50,190z" fill="#f2a64a" /><path id="flame2" d="M1530,810 q-10,-60 20,-90 q20,40 30,90z" fill="#ffe08a" /></g>
            <rect x="1320" y="410" width="480" height="30" fill="#6e4a3a" />
            <rect id="glow" x="0" y="0" width="1920" height="1080" fill="#ffb86a" opacity="0.08" />
            <g transform="translate(1180,800)"><ellipse id="catB" cx="0" cy="-30" rx="80" ry="34" fill="#4a4a52" /><circle cx="64" cy="-36" r="26" fill="#4a4a52" /><path d="M-76,-20 q40,30 110,24" fill="none" stroke="#4a4a52" stroke-width="12" stroke-linecap="round" /></g>
          </svg>
          <svg id="paperSvg" class="full" viewBox="0 0 1920 1080" style="opacity: 0">
            <rect x="580" y="160" width="760" height="780" rx="10" fill="#fbf3e2" transform="rotate(-1.5 960 550)" />
          </svg>
          <div id="l1" class="letter" style="top: 260px"></div>
          <div id="l2" class="letter" style="top: 400px"></div>
          <div id="l3" class="letter" style="top: 500px"></div>
          <div id="l4" class="letter" style="top: 600px"></div>
        </div>

        <div id="endText"></div>
        <div id="fadeBlack" class="layer" style="background: #fff"></div>
      </div>
      <audio id="sfx" class="clip" data-start="0" data-duration="96" data-track-index="1" data-volume="1" src="assets/sfx/n2.wav"></audio>
      <audio id="bgm" class="clip" data-start="0" data-duration="96" data-track-index="2" data-volume="0.55" src="assets/bgm/n2.wav"></audio>
    </div>
    <script>
      (() => {
        const D = window.N2, T = window.TEXT, B = D.beats, $ = (id) => document.getElementById(id);
        $("title").textContent = T["n2.title"];
        $("envTo").textContent = T["n2.envTo"];
        $("envFrom").textContent = T["n2.envFrom"];
        $("markText").textContent = T["n2.mark"];
        $("ask").textContent = T["n2.ask"];
        $("reply").textContent = T["n2.reply"];
        $("endText").textContent = T["n2.end"];
        ["l1", "l2", "l3", "l4"].forEach((k) => ($(k).textContent = T[`n2.${k}`]));
        const tl = gsap.timeline({ paused: true });
        const show = (el, at, d = 0.6, e = "power2.out") => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d, ease: e }, at);
        const hide = (el, at, d = 0.6, e = "power2.in") => tl.to(el, { opacity: 0, duration: d, ease: e }, at);

        // 片头标题：字距收拢
        tl.fromTo("#title", { opacity: 0, scaleX: 1.25 }, { opacity: 1, scaleX: 1, duration: 1.6, ease: "power3.out" }, B.title);
        hide("#title", B.titleOut, 0.9);

        // 春·室内：俯冲到窗口时淡入；镜头缓推；写字、猫尾摆
        show("#roomA", B.inA, 0.6);
        tl.fromTo("#roomA svg", { scale: 1.12, transformOrigin: "60% 45%" }, { scale: 1.0, duration: B.env - B.inA, ease: "power1.out" }, B.inA);
        const ink = $("inkLine"), len = ink.getTotalLength();
        tl.fromTo(ink, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: B.writeEnd - B.write, ease: "none" }, B.write);
        tl.fromTo("#armA", { x: 0 }, { x: 230, duration: B.writeEnd - B.write, ease: "none" }, B.write);
        for (let k = 0; k < 14; k++) tl.to("#armA", { y: k % 2 ? 0 : -6, duration: 0.2, ease: "sine.inOut" }, B.write + 0.2 * k);
        tl.fromTo("#catTail", { rotation: -8, transformOrigin: "100% 100%" }, { rotation: 10, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, B.inA);
        // 特写：信封推入，写字，盖邮戳（压下回弹）
        show("#envLayer", B.env, 0.5);
        tl.fromTo("#envelope", { scale: 0.85, rotation: -4, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.9, ease: "power3.out" }, B.env);
        tl.fromTo("#envTo", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, B.envText);
        tl.fromTo("#envFrom", { opacity: 0 }, { opacity: 1, duration: 0.6 }, B.envText + 0.6);
        tl.fromTo("#markG", { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" }, { opacity: 0.9, scale: 1, duration: 0.18, ease: "power4.in" }, B.stamp - 0.18);
        tl.fromTo("#envelope", { y: 0 }, { y: 8, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, B.stamp);
        hide("#envLayer", B.standUp, 0.5);
        hide("#roomA", B.outA - 0.2, 0.7);

        // 夏：对白气泡（位置由 3D 投影驱动）
        tl.fromTo("#ask", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, B.ask);
        hide("#ask", B.reply - 0.1, 0.3);
        tl.fromTo("#reply", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, B.reply);
        hide("#reply", B.summerEnd - 0.5, 0.3);

        // 秋→冬：枫叶从右上飘落，越飘越近，盖满画面
        tl.set("#leaf", { opacity: 1 }, B.leaf);
        tl.fromTo("#leaf", { x: 1500, y: -150, scale: 0.4 }, { x: 960, y: 560, scale: 18, duration: B.leafEnd - B.leaf, ease: "power2.in" }, B.leaf);
        tl.fromTo("#leafShape", { rotation: -40 }, { rotation: 200, duration: B.leafEnd - B.leaf, ease: "sine.inOut" }, B.leaf);
        hide("#leaf", B.leafEnd, 0.7, "power1.out");

        // 冬·室内：敲门后入室；炉火跳动；信纸铺开，逐行出字
        show("#roomB", B.inB, 0.6);
        tl.fromTo("#roomB > svg:first-child", { scale: 1.08, transformOrigin: "50% 50%" }, { scale: 1, duration: 2.5, ease: "power2.out" }, B.inB);
        for (let k = 0; k < 40; k++) tl.to("#flame1", { scaleY: 0.86 + 0.2 * ((k * 37) % 7) / 6, scaleX: 1.04 - 0.08 * (k % 3), transformOrigin: "50% 100%", duration: 0.18, ease: "sine.inOut" }, B.inB + 0.18 * k);
        for (let k = 0; k < 40; k++) tl.to("#glow", { opacity: 0.06 + 0.04 * ((k * 53) % 5) / 4, duration: 0.18 }, B.inB + 0.18 * k);
        tl.fromTo("#catB", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 1.08, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 6 }, B.inB);
        tl.fromTo("#paperSvg", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, B.letter - 0.9);
        D.letterLines.forEach((at, k) => tl.fromTo(`#l${k + 1}`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "power2.out" }, at));
        hide("#roomB", B.outB, 0.9);

        // 尾声
        tl.fromTo("#endText", { opacity: 0, scaleX: 1.12 }, { opacity: 1, scaleX: 1, duration: 1.6, ease: "power3.out" }, B.endText);
        tl.fromTo("#fadeBlack", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.set({}, {}, D.duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module" src="n2.js"></script>
  </body>
</html>
