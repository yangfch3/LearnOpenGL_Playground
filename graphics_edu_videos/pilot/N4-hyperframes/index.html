<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/shared/vendor/gsap/gsap.min.js"></script>
    <script src="assets/data/n4.js"></script>
    <script src="assets/text/zh-CN.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/shared/vendor/three/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/shared/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/shared/fonts/JetBrainsMono-VF.ttf") format("truetype"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #res { position: absolute; right: 96px; bottom: 120px; font-family: "JetBrains Mono", monospace; font-size: 36px; font-weight: 500;
             color: #1d2733; letter-spacing: 2px; opacity: 0; }
      #title { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; opacity: 0; }
      .cover { position: absolute; inset: 0; opacity: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90.4" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="90.4" data-track-index="0" data-layout-allow-overlap>
        <canvas id="gl" width="1920" height="1080"></canvas>
        <canvas id="title" width="1920" height="1080"></canvas>
        <div id="res"></div>
        <div id="fade" class="cover"></div>
      </div>
      <audio id="sfx" class="clip" data-start="0" data-duration="90.4" data-track-index="1" data-volume="1" src="assets/sfx/n4.wav"></audio>
      <audio id="bgm" class="clip" data-start="0" data-duration="90.4" data-track-index="2" data-volume="0.6" src="assets/bgm/n4.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, window.N4.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="n4.js"></script>
  </body>
</html>
