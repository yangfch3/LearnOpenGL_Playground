<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/shared/vendor/gsap/gsap.min.js"></script>
    <script src="assets/data/p1.js"></script>
    <script src="assets/text/zh-CN.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/shared/vendor/three/three.module.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: url("assets/shared/fonts/NotoSansSC-VF.ttf") format("truetype");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #11161d; }
      #root { width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; color: #edf1f7; }
      #stage { position: absolute; inset: 0; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #labels { position: absolute; inset: 0; opacity: 0; }
      .lab {
        position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 36px; font-weight: 500; line-height: 48px;
        padding: 0 10px; border-radius: 8px; background: rgba(17, 22, 29, 0.72);
      }
      .view { color: #45c4e0; }
      #tag { position: absolute; left: 96px; top: 80px; font-size: 36px; font-weight: 500; color: #9aa6b8; }
      #cap { position: absolute; left: 0; width: 1920px; top: 900px; text-align: center; font-size: 44px; line-height: 1.4; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="16" data-track-index="0" data-layout-allow-overlap>
        <canvas id="gl" width="1920" height="1080"></canvas>
        <div id="labels">
          <div id="labEye" class="lab"></div>
          <div id="labNear" class="lab view"></div>
          <div id="labFar" class="lab view"></div>
        </div>
        <div id="tag"></div>
        <div id="cap" data-hold></div>
      </div>
    </div>
    <script>
      (() => {
        const D = window.P1, T = window.TEXT, B = D.beats;
        document.getElementById("tag").textContent = T["p1.tag"];
        document.getElementById("cap").textContent = T["p1.cap"];
        document.getElementById("labEye").textContent = T["p1.eye"];
        document.getElementById("labNear").textContent = T["p1.near"];
        document.getElementById("labFar").textContent = T["p1.far"];
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#labels", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, B.labels);
        tl.fromTo("#cap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B.cap);
        tl.to("#cap", { opacity: 0, duration: 0.3, ease: "power2.in" }, B.capOut);
        tl.set({}, {}, D.duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module" src="p1.js"></script>
  </body>
</html>
