<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/shared/vendor/gsap/gsap.min.js"></script>
    <script src="assets/data/n5.js"></script>
    <script src="assets/text/zh-CN.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/shared/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #EEE6D3; }
      #root { width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #title { position: absolute; left: 0; right: 0; margin: 0 auto; top: 860px; width: fit-content; text-align: center; font-size: 96px; line-height: 1; font-weight: 300;
               letter-spacing: 40px; text-indent: 40px; color: #EEE6D3; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="80.5" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="80.5" data-track-index="0" data-layout-allow-overflow>
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div id="title"></div>
      </div>
      <audio id="sfx" class="clip" data-start="0" data-duration="80.5" data-track-index="1" data-volume="1" src="assets/sfx/n5.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, window.N5.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="n5.js"></script>
  </body>
</html>
