<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/shared/vendor/gsap/gsap.min.js"></script>
    <script src="assets/data/n3.js"></script>
    <script src="assets/text/zh-CN.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/shared/vendor/three/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/shared/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6efe3; }
      #root { width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      svg.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; font-family: "Noto Sans SC", sans-serif; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; display: none; }
      .title { position: absolute; left: 300px; top: 210px; font-size: 150px; font-weight: 300; letter-spacing: 40px; color: #4a3b34; opacity: 0; }
      #paper { position: absolute; inset: 0; mix-blend-mode: multiply; pointer-events: none; will-change: transform; }
      .cover { position: absolute; inset: 0; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="85" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="85" data-track-index="0" data-layout-allow-overlap>
        <svg id="art" class="full" viewBox="0 0 1920 1080"></svg>
        <canvas id="gl" width="1920" height="1080"></canvas>
        <svg id="art2" class="full" viewBox="0 0 1920 1080"></svg>
        <div id="shut" class="cover" style="background: #000"></div>
        <div id="title" class="title"></div>
        <div id="endTitle" class="title" style="left: 230px; top: 170px"></div>
        <svg id="paper" class="full" viewBox="0 0 1920 1080">
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="f" />
            <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 -0.9 0.62" />
          </filter>
          <filter id="blot" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="3" result="f" />
            <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 -0.5 0.33" />
          </filter>
          <rect width="1920" height="1080" filter="url(#grain)" />
          <rect width="1920" height="1080" filter="url(#blot)" />
        </svg>
        <div id="fade" class="cover" style="background: #f6efe3"></div>
      </div>
      <audio id="sfx" class="clip" data-start="0" data-duration="85" data-track-index="1" data-volume="1" src="assets/sfx/n3.wav"></audio>
      <audio id="bgm" class="clip" data-start="0" data-duration="85" data-track-index="2" data-volume="0.55" src="assets/bgm/n3.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, window.N3.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="n3.js"></script>
  </body>
</html>
